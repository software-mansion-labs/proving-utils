[workspace]
members = [
    "crates/cairo-program-runner",
    "crates/cairo-program-runner-lib",
    "crates/stwo_run_and_prove",
    "crates/vm_runner",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/starkware-libs/proving-utils"

[workspace.dependencies]
anyhow = "1.0.98"
bincode = { version = "2.0.1", features = ["serde"] }
cairo-air = { git = "https://github.com/software-mansion-labs/stwo-cairo/", rev = "b30407140c6f2b656045a866973f6df2e7242e03" }
cairo-lang-executable = "*"
cairo-lang-runner = "*"
cairo-lang-casm = "*"
cairo-lang-execute-utils = "*"
cairo-program-runner-lib = { path = "crates/cairo-program-runner-lib", version = "1.0.0" }
cairo-vm = { version = "=3.1.0", features = [
    "extensive_hints",
    "mod_builtin",
    "clap",
] }
clap = { version = "4.3.10", features = ["derive"] }
ctor = "0.2"
env_logger = "0.11.3"
log = "0.4.21"
num-bigint = "0.4"
num-traits = "0.2.19"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sonic-rs = "0.3.17"
starknet-crypto = "=0.8.1"
starknet-ff = "0.3.7"
starknet-types-core = "=0.2.4"
stwo-cairo-utils = { git = "https://github.com/software-mansion-labs/stwo-cairo/", rev = "eec41a6ff9c2b6623b11e35a657d7582e40f16e4" }
stwo-cairo-adapter = { git = "https://github.com/software-mansion-labs/stwo-cairo/", rev = "eec41a6ff9c2b6623b11e35a657d7582e40f16e4" }
stwo-cairo-prover = { git = "https://github.com/software-mansion-labs/stwo-cairo/", rev = "eec41a6ff9c2b6623b11e35a657d7582e40f16e4" }
stwo-cairo-serialize = { git = "https://github.com/software-mansion-labs/stwo-cairo/", rev = "eec41a6ff9c2b6623b11e35a657d7582e40f16e4" }
tempfile = "3.10.1"
thiserror = "1.0.61"
thiserror-no-std = "2.0.2"
tracing = "0.1.40"
mockall = "0.13.1"
rstest = "0.21"
